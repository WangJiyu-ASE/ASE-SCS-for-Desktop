# electron-builder 打包配置（唯一来源，改打包行为只改本文件）。
#
# 产物：release/SCS Setup.exe（由 scripts/package-win.mjs 在系统临时目录构建后复制到 release/）。
# directories.output 仅作兜底；实际出包由 package-win 覆盖为 %TEMP%/ase-scs-for-desktop-electron-out。

appId: jp.ase.smartconstruction.desktop
productName: SCS
copyright: Copyright © ASE

directories:
  output: .electron-out
  # 应用图标 icon.ico 与 NSIS 资源同根目录（见 .cursor/skills/scs-brand-assets/SKILL.md）
  buildResources: resources

# 只把编译产物与 package.json 放进 asar；源码不经打包
files:
  - dist/**/*
  - package.json

asar: true

# 运行期需要绝对路径访问的资源，放到 <安装目录>/resources/ 下（与 app.asar 同级），
# 主进程通过 process.resourcesPath 读取，见 src/main/RuntimePaths.ts
extraResources:
  - from: resources/fallback.html
    to: fallback.html

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  # 固定产物体名，交付/文档里统一按 "SCS Setup.exe" 引用
  artifactName: SCS Setup.${ext}

nsis:
  # 让用户能选安装目录，并生成桌面 / 开始菜单快捷方式
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SCS 智慧工地
  uninstallDisplayName: SCS 智慧工地
  # 与登录页一致的图标与向导皮肤（由 npm run gen:icon 生成）
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerSidebar: installer/installerSidebar.bmp
  installerHeader: installer/installerHeader.bmp
  installerLanguages:
    - zh_CN
  language: "2052"
  runAfterFinish: true
  multiLanguageInstaller: false
