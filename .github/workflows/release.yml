name: Release Windows Installer

# 在 Windows runner 上原生构建，产出可安装的 SCS Setup.exe。
# 手动触发：Actions → Release Windows Installer → Run workflow
# 打 tag 触发：git tag v0.1.0 && git push --tags（会自动创建 Release 并附上安装包）

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 刻意不拉取 submodules：BuildInfo 里的 web 提交号由
        # `git ls-tree HEAD web` 读取（无需初始化子仓库），
        # 因此这里不需要为私有子仓库配置 token。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate build info
        run: npm run gen:build-info

      - name: Build installer
        run: npm run dist:win
        env:
          # 未配置代码签名证书，避免 electron-builder 去找签名工具而报错
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCS-Setup
          path: "release/SCS Setup.exe"
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "release/SCS Setup.exe"
          generate_release_notes: true
